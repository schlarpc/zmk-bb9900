# Uncomment and change any of these to override the board defaults.

# Milliseconds without a key press before the keyboard backlight turns off
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Keyboard backlight
# CONFIG_ZMK_BACKLIGHT_BRT_START=40
# CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
# CONFIG_ZMK_BACKLIGHT_ON_START=y
# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Smooth (high-resolution) scrolling. Windows, Linux and Android support it. Turn it off if you
# use the keyboard with a Mac or an iPhone/iPad: hosts that do not support it scroll about 16x
# too fast.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Trackpad backlight, lit while scroll mode is on (1-100)
# CONFIG_ZMK_BB9900_TRACKPAD_INDICATOR_BRT=100

# Big button backlight, used as a layer indicator
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_BRT=100
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_MAX_BRT=100
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_MIN_BRT=20
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_STEP=5
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_INTERVAL=20
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_BLINK_INTERVAL=300

# Trackpad pointer and scroll speed are set in bb9900.keymap, not here.

# Uncomment and change any of these to override the board defaults.

# Milliseconds without use before the keyboard backlight and indicator lights turn off
# CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep: milliseconds without use before the keyboard powers down (a key press wakes it,
# and that key is not typed). Set CONFIG_ZMK_SLEEP=n to stay awake until the power switch.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Keyboard backlight
# CONFIG_ZMK_BACKLIGHT_BRT_START=40
# CONFIG_ZMK_BACKLIGHT_BRT_STEP=10
# CONFIG_ZMK_BACKLIGHT_ON_START=y
# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Bluetooth pairing asks for the 6-digit code shown on the host: type it (SYM layer digits) and
# press Enter; Esc cancels. Set to n to pair without a code.
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Smooth (high-resolution) scrolling. Windows, Linux and Android support it; Mac, iPhone and iPad
# do not and scroll about 16x too fast. Rather than turning it off here, press UPPER-F while
# connected to such a host to switch that output (BLE profile or USB) to whole notches.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Trackpad backlight, lit while scroll mode is on (1-100)
# CONFIG_ZMK_BB9900_TRACKPAD_INDICATOR_BRT=100

# Big button backlight, used as a layer indicator
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_BRT=100
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_MAX_BRT=100
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_MIN_BRT=20
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_STEP=5
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_CYCLE_INTERVAL=20
# CONFIG_ZMK_BB9900_LAYER_INDICATOR_BLINK_INTERVAL=300

# Trackpad pointer and scroll speed are set in bb9900.keymap, not here.

# SPDX-License-Identifier: MIT

description: |
  Avago ADBS-A320 optical finger navigation sensor, as used for the BlackBerry 9900 trackpad.
  Reports relative X/Y motion through the Zephyr input subsystem.

compatible: "avago,a320"

include: i2c-device.yaml

properties:
  polling-interval-ms:
    type: int
    default: 10
    description: How often to poll the motion register.
  ext-power:
    type: phandle
    description: |
      External power control that supplies the sensor. Used to power cycle the sensor when it
      stops responding.
  speed-switching:
    type: boolean
    description: |
      Let the sensor switch resolution with finger speed (250 to 1000 CPI), which acts as
      built-in pointer acceleration. Off from reset; the datasheet power-up sequence enables it.
  assert-deassert:
    type: boolean
    description: Gate motion on image quality, to reject noise when the finger lifts.
  finger-detect:
    type: boolean
    description: Only report motion while a finger is on the sensor.

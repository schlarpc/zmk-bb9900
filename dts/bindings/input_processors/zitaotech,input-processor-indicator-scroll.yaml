# SPDX-License-Identifier: MIT

description: |
  Turns relative X/Y motion into scroll wheel events while any of the given HID indicators
  (caps lock, scroll lock, ...) is reported on by the host. Motion is accumulated and turned
  into scroll steps at most once per interval, using the stepped speed curve from the original
  BB9900 firmware.

  Expects REL_Y before REL_X in each report, which is what you get from a driver that reports
  X then Y followed by an XY swap transform.

compatible: "zitaotech,input-processor-indicator-scroll"

include: ip_zero_param.yaml

properties:
  indicators:
    type: int
    required: true
    description: Bitmask of HID_INDICATOR_* values that enable scroll mode.
  interval-ms:
    type: int
    default: 30
    description: Minimum time between emitted scroll steps.
